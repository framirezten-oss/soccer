<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Athlete Shooting Click-Tracker (Supabase Cloud)</title>
    <!-- Include Supabase Client Library CDN -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 0 20px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #4f46e5; color: white; border: none; padding: 10px 15px; cursor: pointer; font-weight: bold; border-radius: 4px; }
        button:hover { background: #4338ca; }
        .submit-btn { width: 100%; margin-top: 15px; padding: 12px; }
        .canvas-container { margin-top: 20px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 15px; text-align: center; }
        canvas { background: white; border: 1px solid #e2e8f0; display: block; margin: 0 auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .flex { display: flex; gap: 10px; margin-top: 20px; margin-bottom: 10px; }
        .accuracy-badge { font-size: 20px; font-weight: bold; color: #1e293b; margin-top: 10px; }
        
        .volume-btn-row { display: flex; gap: 10px; margin-top: 5px; }
        .vol-btn { flex: 1; padding: 10px; background: #e2e8f0; color: #334155; border: 2px solid transparent; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .vol-btn:hover { background: #cbd5e1; }
        .vol-btn.active { background: #6366f1; color: white; border-color: #4f46e5; }

        .live-tracker-panel { background: #f1f5f9; padding: 15px; border-radius: 8px; border: 1px dashed #cbd5e1; margin-top: 15px; text-align: center; }
        .tracker-btn-row { display: flex; gap: 15px; justify-content: center; margin-top: 12px; }
        .click-btn { width: 160px; padding: 15px; font-size: 15px; color: white; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; transition: transform 0.1s; }
        .click-btn:active { transform: scale(0.95); }
        .hit-btn { background: #22c55e; }
        .hit-btn:hover { background: #16a34a; }
        .miss-btn { background: #ef4444; }
        .miss-btn:hover { background: #dc2626; }
        .click-btn:disabled { background: #cbd5e1; color: #94a3b8; cursor: not-allowed; transform: none; }
        .counter-status { font-size: 18px; font-weight: bold; color: #334155; margin-bottom: 5px; }
    </style>
</head>
<body>

    <header class="nav-bar" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px;">
        <h1 style="margin: 0; font-size: 22px; color: #1e293b;">Cloud Shooting Dashboard</h1>
        <div>
            <button type="button" id="toTrackingPageBtn" style="background: #0f172a; font-size: 14px; padding: 8px 16px;">🎯 Session Tracker</button>
            <button type="button" id="toStatisticsPageBtn" style="background:#4f46e5; font-size: 14px; padding: 8px 16px;">📊 View Stats</button>
        </div>
    </header>
    
    <!-- PAGE 1: TRACKING SESSION -->
    <main id="trackingPageView" style="display: block;">
        <form id="evalForm">
            <div class="form-group">
                <label>Athlete Name:</label>
                <select id="name" required>
                    <option value="PLAYER_1">PLAYER_1</option>
                    <option value="PLAYER_2">PLAYER_2</option>
                    <option value="PLAYER_3">PLAYER_3</option>
                    <option value="PLAYER_4">PLAYER_4</option>
                    <option value="PLAYER_5">PLAYER_5</option>
                    <option value="PLAYER_6">PLAYER_6</option>
                    <option value="PLAYER_7">PLAYER_7</option>
                    <option value="PLAYER_8">PLAYER_8</option>
                    <option value="PLAYER_9">PLAYER_9</option>
                    <option value="PLAYER_10">PLAYER_10</option>
                </select>
            </div>
            <div class="form-group">
                <label>Date:</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <label>Number of Shots:</label>
                <div class="volume-btn-row">
                    <button type="button" class="vol-btn active" data-val="10">10 Shots</button>
                    <button type="button" class="vol-btn" data-val="20">20 Shots</button>
                    <button type="button" class="vol-btn" data-val="30">30 Shots</button>
                    <button type="button" class="vol-btn" data-val="40">40 Shots</button>
                </div>
            </div>
            <button type="submit" class="submit-btn">Start Tracking Session</button>
        </form>

        <div id="liveTrackerPanel" class="live-tracker-panel" style="display: none;">
            <div id="activeSessionHeader" style="font-weight: bold; font-size: 16px; color: #4f46e5;">Active Session</div>
            <div id="shotCounterDisplay" class="counter-status">Shots Remaining: 10 / 10</div>
            <div id="currentLiveStats" style="font-size: 13px; color: #64748b; margin-bottom: 10px;">Hits: 0 | Misses: 0</div>
            
            <div class="tracker-btn-row">
                <button type="button" id="hitBtn" class="click-btn hit-btn">⚽ Hit / Success</button>
                <button type="button" id="missBtn" class="click-btn miss-btn">❌ Miss / Failed</button>
            </div>
            <button type="button" id="saveSessionBtn" style="background: #0f172a; max-width: 200px; margin: 15px auto 0 auto; display: none;">Save & Sync to Cloud</button>
        </div>
    </main>

    <!-- PAGE 2: RESULTS & STATISTICS -->
    <main id="statisticsPageView" style="display: none;">
        <div class="flex">
            <div>
                <label>Filter View by Athlete:</label>
                <select id="filterAthlete"></select>
            </div>
        </div>

        <div class="canvas-container">
            <h3 id="graphTitle" style="margin-top:0; color:#334155;">Shooting Metrics</h3>
            <canvas id="customChart" width="600" height="250"></canvas>
            <div id="accuracyDisplay" class="accuracy-badge">Accuracy: --%</div>
        </div>

        <table>
            <thead>
                <tr><th>Date</th><th>Athlete</th><th>Total Shots</th><th>Successful (Hits)</th><th>Missed (Failed)</th><th>Accuracy</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </main>

    <script src="app_soc.js"></script>
</body>
</html>
